
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "8080:8080"

    networks:
      - dokploy_private

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  dokploy_private:
    external: true
    name: "${DOKPLOY_PRIVATE_NETWORK:?Définir DOKPLOY_PRIVATE_NETWORK dans Dokploy}"
